{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                {{ action }} Product
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Product Name</label>
                        <input type="text" name="name" class="form-control" value="{{ product.name|default:'' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select name="category" class="form-select">
                            <option value="">-- No Category --</option>
                            {% for cat in categories %}
                            <option value="{{ cat.id }}" {% if product.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Unit</label>
                        <input type="text" name="unit" class="form-control" placeholder="e.g. kg, pieces, boxes" value="{{ product.unit|default:'' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Minimum Threshold</label>
                        <input type="number" name="minimum_threshold" class="form-control" min="0" value="{{ product.minimum_threshold|default:'10' }}" required>
                    </div>
                    {% if action == 'Add' %}
                    <div class="mb-3">
                        <label class="form-label">Initial Stock</label>
                        <input type="number" name="current_stock" class="form-control" min="0" value="0" required>
                    </div>
                    {% endif %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-dark">{{ action }} Product</button>
                        <a href="{% url 'product_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
