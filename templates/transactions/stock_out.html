{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-danger text-white">
                <i class="bi bi-box-arrow-up"></i> Record Stock Out
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Product</label>
                        <select name="product" class="form-select" required>
                            <option value="">-- Select Product --</option>
                            {% for p in products %}
                            <option value="{{ p.id }}">{{ p.name }} (Current: {{ p.current_stock }} {{ p.unit }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Quantity</label>
                        <input type="number" name="quantity" class="form-control" min="1" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Reason</label>
                        <select name="out_reason" class="form-select">
                            <option value="">-- Select Reason --</option>
                            <option value="sold">Sold</option>
                            <option value="damaged">Damaged / Expired</option>
                            <option value="internal">Internal Use</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notes <span class="text-muted small">(optional)</span></label>
                        <textarea name="notes" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">Record Stock Out</button>
                        <a href="{% url 'transaction_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
