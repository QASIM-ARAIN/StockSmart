{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <i class="bi bi-box-arrow-in-down"></i> Record Stock In
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Product</label>
                        <select name="product" class="form-select" required>
                            <option value="">-- Select Product --</option>
                            {% for p in products %}
                            <option value="{{ p.id }}">{{ p.name }} (Current: {{ p.current_stock }} {{ p.unit }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Quantity</label>
                        <input type="number" name="quantity" class="form-control" min="1" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Supplier <span class="text-muted small">(optional)</span></label>
                        <select name="supplier" class="form-select">
                            <option value="">-- No Supplier --</option>
                            {% for s in suppliers %}
                            <option value="{{ s.id }}">{{ s.name }}</option>
                            {% endfor %}
                        </select>
                        <small class="text-muted">Don't see your supplier? <a href="{% url 'supplier_add' %}">Add one here</a></small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notes <span class="text-muted small">(optional)</span></label>
                        <textarea name="notes" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">Record Stock In</button>
                        <a href="{% url 'transaction_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
